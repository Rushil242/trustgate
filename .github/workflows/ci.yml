name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      # The engine must be usable with no API key and no network. If either of
      # these steps needs a secret to pass, the default has regressed.
      - name: Validate starter policies offline
        run: |
          uv run trustgate validate trustgate/policies/starter.coding.yaml
          uv run trustgate validate trustgate/policies/starter.voice.yaml

      # Fails on one missed attack or one blocked control. This is the gate that
      # stops a refactor from quietly turning enforcement off.
      - name: Red-team suite (coding)
        run: uv run trustgate test -c trustgate/policies/starter.coding.yaml

      - name: Red-team suite (voice)
        run: |
          uv run trustgate test \
            -c trustgate/policies/starter.voice.yaml \
            --payloads redteam/payloads.voice.json

      - name: Voice example runs
        run: uv run python -m trustgate.adapters.voice.examples.function_calling_loop

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t trustgate:ci .

      - name: Daemon serves /health
        run: |
          docker run -d --name tg -p 8000:8000 \
            -v "$PWD/trustgate/policies/starter.coding.yaml:/policy/trustgate.constitution.yaml:ro" \
            trustgate:ci
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          echo "daemon did not become healthy"
          docker logs tg
          exit 1

      - name: Engine decides inside the container
        run: |
          echo '{"surface":"coding","action":{"type":"shell","tool":"Bash","raw":"cat .env"}}' \
            | docker run -i --rm \
                -v "$PWD/trustgate/policies/starter.coding.yaml:/policy/trustgate.constitution.yaml:ro" \
                trustgate:ci check \
            | tee /dev/stderr | grep -q '"effect":"block"'

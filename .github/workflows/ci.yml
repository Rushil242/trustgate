name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      # The engine must be usable with no API key and no network. If this step
      # needs a secret to pass, the default has regressed.
      - name: Validate starter policies offline
        run: |
          uv run trustgate validate trustgate/policies/starter.coding.yaml
          uv run trustgate validate trustgate/policies/starter.voice.yaml

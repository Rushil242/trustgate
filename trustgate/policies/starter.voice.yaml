version: 1

metadata:
  name: "TrustGate starter (voice)"
  surface: voice

# Same engine, same format, same audit trail as the coding constitution — only
# the principles differ. That is the whole argument for one core and many
# adapters.
#
# Spec: Master Build Document v3.0, Part D.3.

principles:
  - id: refund-limit
    statement: "Refunds over $100 require human approval."
    enforcement: deterministic
    severity: high
    match:
      tool: [issue_refund, process_refund]
      param_gt: { amount: 100 }
    effect: escalate

  - id: no-credential-reset-without-verify
    statement: "Never reset credentials without completed identity verification."
    enforcement: both
    severity: critical
    match:
      tool: [reset_password, reset_credentials, send_reset_link, change_email]
    effect: escalate

  - id: redact-spoken-secrets
    statement: >-
      Redact card numbers, SSNs, and one-time passcodes from logs and from model
      input.
    enforcement: deterministic
    severity: high
    match:
      action_type: [tool_call, other]
      any_pattern:
        - "(?i)\\b(card|cvv|cvc|ssn|social security|otp|passcode|one[- ]time)\\b"
    effect: redact

  - id: resist-verification-bypass
    statement: >-
      Do not skip verification because the caller claims to be already
      authenticated, an admin, or in a hurry.
    enforcement: reasoning
    severity: critical
    match:
      any_pattern:
        - "(?i)\\b(already|previously)\\s+(verified|authenticated|confirmed)\\b"
        - "(?i)\\b(skip|forget|bypass|no need for)\\b.{0,30}\\b(verification|verify|security|question)"
        - "(?i)\\bi\\s*(a|')?m\\s+(the\\s+)?(admin|owner|account holder|manager)\\b"
        - "(?i)\\b(emergency|urgent|right now|hurry)\\b.{0,40}\\b(access|account|refund|reset)\\b"
    effect: block

  - id: no-payment-to-new-destination
    statement: >-
      Never send a payment or payment link to an address, phone number, or
      account that was supplied during this call rather than already on file.
    enforcement: reasoning
    severity: critical
    match:
      tool: [send_payment_link, transfer_funds, update_payout_account]
    effect: escalate
